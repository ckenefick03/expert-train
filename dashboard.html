    const upl = hasPrice ? (p.price - p.entry) * p.qty : null;
    const g = el("div", "grid2");
    const cell = (k, v, c) => { const d = el("div"); d.appendChild(el("span", "", k)); d.appendChild(el("b", c || "", v)); g.appendChild(d); };
    cell("Entry", money(p.entry));
    cell("Current", hasPrice ? money(p.price) : "n/a");
    cell("Unrealized P&L", hasPrice ? signed(upl) : "n/a", hasPrice ? cls(upl) : "");
    if (typeof p.stop === "number") cell("To stop", hasPrice ? money((p.price - p.stop) * p.qty) + " (" + money(p.price - p.stop) + "/sh)" : "n/a");
    if (typeof p.target === "number") cell("To target", hasPrice ? money((p.target - p.price) * p.qty) + " (" + money(p.target - p.price) + "/sh)" : "n/a");
    card.appendChild(g);
    if (typeof p.stop === "number" && typeof p.target === "number" && hasPrice) {
      const frac = Math.max(0, Math.min(1, (p.price - p.stop) / (p.target - p.stop)));
      const bar = el("div", "bar");
      const fill = el("div", "fill"); fill.style.width = (frac * 100) + "%"; bar.appendChild(fill);
      const mark = el("i"); mark.style.left = "calc(" + (frac * 100) + "% - 1px)"; bar.appendChild(mark);
      card.appendChild(bar);
      const lbl = el("div", "barlbl"); lbl.appendChild(el("span", "", "STOP " + money(p.stop))); lbl.appendChild(el("span", "", "TARGET " + money(p.target))); card.appendChild(lbl);
    } else {
      card.appendChild(el("div", "legend", p.legacy ? "Held before the framework started: no stop/target is defined and the framework does not manage it." : "Stop/target or live price missing: check this position manually next cycle."));
    }
    pe.appendChild(card);
  });

  // Recent trades
  const te = $("trades");
  const recent = trades.slice(-15).reverse();
  if (!recent.length) te.appendChild(el("div", "empty", "No closed trades yet."));
  else {
    const tb = el("table");
    const hr = el("tr");
    ["Symbol", "Strategy", "Entry", "Exit", "P&L", "R", "Score", "Tag"].forEach(h => hr.appendChild(el("th", "", h)));
    tb.appendChild(hr);
    recent.forEach(t => {
      const r = el("tr");
      r.appendChild(el("td", "", t.symbol));
      r.appendChild(el("td", "", (t.strategy || "") + (t.tier && t.tier !== "-" ? " " + t.tier : "")));
      r.appendChild(el("td", "", money(t.entry)));
      r.appendChild(el("td", "", money(t.exit)));
      r.appendChild(el("td", cls(t.pnl), signed(t.pnl)));
      r.appendChild(el("td", cls(t.r), (t.r > 0 ? "+" : "") + Number(t.r).toFixed(2) + "R"));
      r.appendChild(el("td", "", t.score === undefined ? "n/a" : String(t.score)));
      const td = el("td"); td.appendChild(el("span", "chip " + (t.tag === "forced" ? "f" : "o"), t.tag || "organic")); r.appendChild(td);
      tb.appendChild(r);
    });
    te.appendChild(tb);
  }

  // Regime
  const reg = DATA.regime || {};
  const chipsEl = $("chips");
  (reg.chips || []).forEach(c => {
    const s = el("span", "chip", c.name + " " + (c.chg > 0 ? "+" : "") + Number(c.chg).toFixed(2) + "%");
    s.style.color = c.chg > 0 ? "#5dff8f" : c.chg < 0 ? "#ff5a4a" : "#a07418";
    s.style.borderColor = s.style.color;
    chipsEl.appendChild(s);
  });
  if (!(reg.chips || []).length) chipsEl.appendChild(el("span", "sub", "No sector/index data yet."));
  $("regime").textContent = reg.read || "";
})();
</script>
</body>
</html>
